name: Book Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      deployments: write
    name: Publish to GitHub Pages
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup mdbook
        run: |
          cargo install --locked --version 0.4.40 mdbook
          cargo install --locked mdbook-mermaid mdbook-template mdbook-alerts
      - name: Build book
        working-directory: ./book
        run: mdbook build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
