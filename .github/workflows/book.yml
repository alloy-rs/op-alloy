name: Book Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      deployments: write
    name: Publish to GitHub Pages
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@a8467566cf2204e895d40f6baf19435c8bc7f921 # 2026-09-28T07-41-23Z-a8467566
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Setup mdbook
        run: |
          cargo install --locked --version 0.4.40 mdbook
          # Keep preprocessors compatible with mdBook 0.4; Mermaid 0.17 requires 0.5.
          cargo install --locked --version 0.16.2 mdbook-mermaid
          cargo install --locked --version 1.1.1+deprecated mdbook-template
          cargo install --locked --version 0.8.0 mdbook-alerts
      - name: Build book
        working-directory: ./book
        run: mdbook build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
