name: deps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule: [cron: "00 00 * * *"]

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runnerd67c611dc0050e9f3fcd5bd47f3f899a00e
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - name: Install cargo-deny
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-actiond67c611dc0050e9f3fcd5bd47f3f899a00e
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      - run: cargo deny --all-features check
